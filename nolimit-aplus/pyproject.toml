[project]
name = "nolimit-aplus"
version = "0.1.0"
description = "NO LIMIT A+++ - Bitget multi-asset trading intelligence (read-only audit, scanner, validation, risk engine, demo/paper execution)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.1", "numpy>=1.26", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aplus = "aplus.cli:main"

[tool.setuptools.packages.find]
include = ["aplus*"]

[tool.setuptools.package-data]
aplus = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
